version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Africa/Lagos
    commit-message:
      prefix: build
      include: scope
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Types follow the Node major we run (.nvmrc).
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # @convex-dev/better-auth supports better-auth 1.6.x only.
      - dependency-name: 'better-auth'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Africa/Lagos
    commit-message:
      prefix: ci
